<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Michel Maths Academy</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #007bff; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #333; }
        
        /* Login Container */
        .login-container { background: #ffffff; padding: 2.5rem; border-radius: 12px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15); width: 100%; max-width: 400px; text-align: center; }
        .academy-logo { font-size: 2rem; color: #007bff; margin-bottom: 0.5rem; font-weight: 700; }
        .subtitle { color: #666; font-size: 0.95rem; margin-bottom: 1.5rem; }
        .error-alert { display: none; background-color: #fce4e4; border: 1px solid #fcc2c2; color: #cc0000; padding: 0.75rem; border-radius: 6px; margin-bottom: 1.5rem; font-size: 0.85rem; text-align: left; }
        .input-group { margin-bottom: 1.5rem; text-align: left; position: relative; }
        label { display: block; margin-bottom: 0.5rem; font-weight: 600; font-size: 0.9rem; color: #444; }
        input[type="text"], input[type="password"] { width: 100%; padding: 0.75rem 1rem; border: 2px solid #ddd; border-radius: 6px; font-size: 1rem; outline: none; }
        input:focus { border-color: #007bff; }
        .toggle-password { position: absolute; right: 12px; top: 38px; background: none; border: none; color: #777; cursor: pointer; font-size: 0.85rem; }
        .utilities { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; font-size: 0.85rem; }
        .utilities a { color: #007bff; text-decoration: none; font-weight: 600; }
        .login-btn { width: 100%; padding: 0.75rem; background: #007bff; border: none; border-radius: 6px; color: white; font-size: 1rem; font-weight: 600; cursor: pointer; }
        .login-btn:hover { background: #0056b3; }

        /* Dashboard Container (Hidden by default) */
        .dashboard-container { display: none; background: #ffffff; padding: 2.5rem; border-radius: 12px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15); width: 90%; max-width: 500px; text-align: center; }
        .grade-title { font-size: 1.75rem; color: #007bff; margin-bottom: 1.5rem; font-weight: 700; border-bottom: 2px solid #eee; padding-bottom: 0.5rem; }
        .folder-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .folder-card { background: #f8f9fa; border: 2px solid #e9ecef; border-radius: 8px; padding: 1.5rem; text-align: center; cursor: pointer; text-decoration: none; color: #333; font-weight: 600; transition: all 0.2s ease; }
        .folder-card:hover { background: #e9ecef; border-color: #007bff; color: #007bff; }
        .folder-icon { font-size: 2rem; margin-bottom: 0.5rem; display: block; }
    </style>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div class="login-container" id="loginScreen">
        <div class="academy-logo">Michel Maths</div>
        <p class="subtitle">Academy Portal Login</p>
        <div class="error-alert" id="errorAlert"></div>
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="input-group">
                <label for="username">Username or Email</label>
                <input type="text" id="username" placeholder="e.g., michel123">
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••">
                <button type="button" class="toggle-password" onclick="togglePass()">Show</button>
            </div>
            <div class="utilities">
                <label><input type="checkbox"> Remember me</label>
                <a href="#">Forgot password?</a>
            </div>
            <button type="submit" class="login-btn">Log In</button>
        </form>
    </div>

    <!-- STUDENT DASHBOARD -->
    <div class="dashboard-container" id="dashboardScreen">
        <div class="grade-title">Grade 8</div>
        <div class="folder-grid">
            <a href="#" class="folder-card"><span class="folder-icon">📁</span>Term 1</a>
            <a href="#" class="folder-card"><span class="folder-icon">📁</span>Term 2</a>
            <a href="#" class="folder-card"><span class="folder-icon">📁</span>Term 3</a>
            <a href="#" class="folder-card"><span class="folder-icon">📁</span>Term 4</a>
        </div>
    </div>

    <script>
        function togglePass() {
            const passInput = document.getElementById('password');
            const toggleBtn = document.querySelector('.toggle-password');
            if (passInput.type === 'password') { passInput.type = 'text'; toggleBtn.textContent = 'Hide'; }
            else { passInput.type = 'password'; toggleBtn.textContent = 'Show'; }
        }

        function handleLogin(e) {
            e.preventDefault();
            const usernameInput = document.getElementById('username').value.trim();
            const passwordInput = document.getElementById('password').value.trim();
            const errorAlert = document.getElementById('errorAlert');
            
            errorAlert.style.display = 'none';

            // Check details
            if (usernameInput === 'Michel' && passwordInput === 'Michel123') {
                // Hide login, show dashboard
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('dashboardScreen').style.display = 'block';
            } else {
                // Show error message
                errorAlert.textContent = 'Invalid username or password.';
                errorAlert.style.display = 'block';
            }
        }
    </script>
</body>
</html>
