<script>
    const loginScreen =
        document.getElementById('loginScreen');

    const appSubtitle =
        document.getElementById('appSubtitle');

    const loginForm =
        document.getElementById('loginForm');

    const usernameInput =
        document.getElementById('username');

    const passwordInput =
        document.getElementById('password');

    const errorAlert =
        document.getElementById('errorAlert');

    const togglePassword =
        document.getElementById('togglePassword');

    const logoutBtn =
        document.getElementById('logoutBtn');

    const forgotLink =
        document.getElementById('forgotLink');

    const modalOverlay =
        document.getElementById('modalOverlay');

    const closeModal =
        document.getElementById('closeModal');


    /* SCREEN NAVIGATION */

    function openScreen(screenId) {

        const screens =
            document.querySelectorAll(
                '.app-container > div[id$="Screen"]'
            );

        screens.forEach(function(screen) {
            screen.classList.add('hidden');
        });

        const selectedScreen =
            document.getElementById(screenId);

        if (selectedScreen) {
            selectedScreen.classList.remove('hidden');
        }

        window.scrollTo({
            top: 0,
            behavior: 'smooth'
        });
    }


    /* OPEN TOPIC */

    function openTopic(term, topic, backScreen) {

        document.getElementById(
            'topicHeading'
        ).textContent =
            'Grade 8 > ' +
            term +
            ' > ' +
            topic;

        document.getElementById(
            'topicTitle'
        ).textContent = topic;

        document.getElementById(
            'topicText'
        ).textContent =
            'Learning materials for ' +
            topic +
            ' will be placed here.';

        document.getElementById(
            'topicBackBtn'
        ).onclick = function() {
            openScreen(backScreen);
        };

        openScreen('topicScreen');
    }


    /* SHOW / HIDE PASSWORD */

    togglePassword.addEventListener(
        'click',
        function() {

            const isPass =
                passwordInput.type === 'password';

            passwordInput.type =
                isPass ? 'text' : 'password';

            togglePassword.textContent =
                isPass ? 'Hide' : 'Show';
        }
    );


    /* FORGOT PASSWORD */

    forgotLink.addEventListener(
        'click',
        function(e) {

            e.preventDefault();

            modalOverlay.style.display =
                'flex';
        }
    );


    closeModal.addEventListener(
        'click',
        function() {

            modalOverlay.style.display =
                'none';
        }
    );


    /* LOGIN */

    loginForm.addEventListener(
        'submit',
        function(e) {

            e.preventDefault();

            usernameInput.classList.remove(
                'input-error'
            );

            passwordInput.classList.remove(
                'input-error'
            );

            errorAlert.style.display = 'none';


            /*
             * trim() removes accidental spaces
             * before or after the login details.
             */

            const userVal =
                usernameInput.value.trim();

            const passVal =
                passwordInput.value.trim();


            /* EMPTY FIELDS */

            if (!userVal || !passVal) {

                if (!userVal) {
                    usernameInput.classList.add(
                        'input-error'
                    );
                }

                if (!passVal) {
                    passwordInput.classList.add(
                        'input-error'
                    );
                }

                errorAlert.textContent =
                    'Please fill out all fields.';

                errorAlert.style.display =
                    'block';

                return;
            }


            /* CORRECT LOGIN */

            if (
                userVal === 'Michel' &&
                passVal === 'Michel 123'
            ) {

                errorAlert.style.display =
                    'none';

                usernameInput.classList.remove(
                    'input-error'
                );

                passwordInput.classList.remove(
                    'input-error'
                );

                openScreen(
                    'dashboardScreen'
                );

                appSubtitle.textContent =
                    'Welcome back, Michel!';

                return;
            }


            /* INCORRECT LOGIN */

            usernameInput.classList.add(
                'input-error'
            );

            passwordInput.classList.add(
                'input-error'
            );

            errorAlert.textContent =
                'Incorrect username or password. Please try again.';

            errorAlert.style.display =
                'block';
        }
    );


    /* LOGOUT */

    logoutBtn.addEventListener(
        'click',
        function() {

            usernameInput.value = '';
            passwordInput.value = '';

            errorAlert.style.display =
                'none';

            usernameInput.classList.remove(
                'input-error'
            );

            passwordInput.classList.remove(
                'input-error'
            );

            openScreen(
                'loginScreen'
            );

            appSubtitle.textContent =
                'Please sign in to continue';
        }
    );

</script>
