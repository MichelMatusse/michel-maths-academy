<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Michel Maths Academy</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); display: flex; justify-content: center; align-items: center; height: 100vh; color: #333; overflow: hidden; }
        .math-bg { position: absolute; font-size: 12rem; color: rgba(255, 255, 255, 0.03); font-weight: bold; z-index: 1; user-select: none; }
        .pi { top: 5%; left: 5%; } .sigma { bottom: 5%; right: 5%; }
        .login-container { background: #ffffff; padding: 2.5rem; border-radius: 12px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2); width: 100%; max-width: 400px; z-index: 10; text-align: center; }
        .academy-logo { font-size: 2rem; color: #1e3c72; margin-bottom: 0.5rem; font-weight: 700; }
        .academy-logo span { color: #f39c12; }
        .subtitle { color: #666; font-size: 0.95rem; margin-bottom: 1.5rem; }
        .error-alert { display: none; background-color: #fce4e4; border: 1px solid #fcc2c2; color: #cc0000; padding: 0.75rem; border-radius: 6px; margin-bottom: 1.5rem; font-size: 0.85rem; text-align: left; }
        .input-group { margin-bottom: 1.5rem; text-align: left; position: relative; }
        label { display: block; margin-bottom: 0.5rem; font-weight: 600; font-size: 0.9rem; color: #444; }
        input[type="text"], input[type="password"], input[type="email"] { width: 100%; padding: 0.75rem 1rem; border: 2px solid #ddd; border-radius: 6px; font-size: 1rem; transition: border-color 0.3s ease; outline: none; }
        input:focus { border-color: #1e3c72; }
        input.input-error { border-color: #cc0000; background-color: #fff9f9; }
        .toggle-password { position: absolute; right: 12px; top: 38px; background: none; border: none; color: #777; cursor: pointer; font-size: 0.85rem; }
        .utilities { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; font-size: 0.85rem; }
        .utilities a { color: #1e3c72; text-decoration: none; font-weight: 600; }
        .utilities a:hover { text-decoration: underline; }
        .login-btn { width: 100%; padding: 0.75rem; background: #1e3c72; border: none; border-radius: 6px; color: white; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.3s ease; }
        .login-btn:hover { background: #2a5298; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); z-index: 100; justify-content: center; align-items: center; }
        .modal-box { background: #fff; padding: 2rem; border-radius: 12px; width: 90%; max-width: 380px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .modal-box h3 { color: #1e3c72; margin-bottom: 0.5rem; }
        .modal-box p { font-size: 0.9rem; color: #666; margin-bottom: 1.5rem; }
        .modal-buttons { display: flex; gap: 10px; }
        .modal-btn { flex: 1; padding: 0.6rem; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
        .btn-submit { background: #1e3c72; color: white; }
        .btn-close { background: #eee; color: #333; }
    </style>
</head>
<body>
    <div class="math-bg pi">π</div>
    <div class="math-bg sigma">∑</div>
    <div class="login-container">
        <div class="academy-logo">Michel <span>Maths</span></div>
        <p class="subtitle">Academy Portal Login</p>
        <div class="error-alert" id="errorAlert"></div>
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="input-group">
                <label for="username">Username or Email</label>
                <input type="text" id="username" placeholder="e.g., michel123">
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••">
                <button type="button" class="toggle-password" onclick="togglePass()">Show</button>
            </div>
            <div class="utilities">
                <label><input type="checkbox"> Remember me</label>
                <a href="#" onclick="toggleModal(true)">Forgot password?</a>
            </div>
            <button type="submit" class="login-btn">Log In</button>
        </form>
    </div>
    <div class="modal-overlay" id="resetModal">
        <div class="modal-box">
            <h3>Reset Password</h3>
            <p>Enter your email address to receive a recovery link.</p>
            <form onsubmit="handleReset(event)">
                <div class="input-group"><input type="email" placeholder="student@email.com" required></div>
                <div class="modal-buttons">
                    <button type="button" class="modal-btn btn-close" onclick="toggleModal(false)">Cancel</button>
                    <button type="submit" class="modal-btn btn-submit">Send Link</button>
                </div>
            </form>
        </div>
    </div>
    <script>
        function togglePass() {
            const passInput = document.getElementById('password');
            const toggleBtn = document.querySelector('.toggle-password');
            if (passInput.type === 'password') { passInput.type = 'text'; toggleBtn.textContent = 'Hide'; }
            else { passInput.type = 'password'; toggleBtn.textContent = 'Show'; }
        }
        function toggleModal(show) { document.getElementById('resetModal').style.display = show ? 'flex' : 'none'; }
        function handleReset(e) { e.preventDefault(); alert('Password reset link sent to your email.'); toggleModal(false); }
        function handleLogin(e) {
            e.preventDefault();
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const errorAlert = document.getElementById('errorAlert');
            usernameInput.classList.remove('input-error');
            passwordInput.classList.remove('input-error');
            errorAlert.style.display = 'none';
            if (!usernameInput.value.trim() && !passwordInput.value.trim()) { showError('Please enter your username and password.'); usernameInput.classList.add('input-error'); passwordInput.classList.add('input-error'); }
            else if (!usernameInput.value.trim()) { showError('Username field cannot be left blank.'); usernameInput.classList.add('input-error'); }
            else if (!passwordInput.value.trim()) { showError('Password field cannot be left blank.'); passwordInput.classList.add('input-error'); }
            else if (passwordInput.value.length < 6) { showError('Security error: Password must be at least 6 characters.'); passwordInput.classList.add('input-error'); }
            else { alert('Success! Logging you into Michel Maths Academy.'); }
        }
        function showError(message) { const errorAlert = document.getElementById('errorAlert'); errorAlert.textContent = message; errorAlert.style.display = 'block'; }
    </script>
</body>
</html>
