<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Michel Maths Academy</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #007bff; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #333; padding: 20px; }
        
        /* LOGIN PANEL GRAPHICS */
        .login-container { background: #ffffff; padding: 2.5rem; border-radius: 12px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15); width: 100%; max-width: 400px; text-align: center; }
        .academy-logo { font-size: 2rem; color: #007bff; margin-bottom: 0.5rem; font-weight: 700; }
        .subtitle { color: #666; font-size: 0.95rem; margin-bottom: 1.5rem; }
        .error-alert { display: none; background-color: #fce4e4; border: 1px solid #fcc2c2; color: #cc0000; padding: 0.75rem; border-radius: 6px; margin-bottom: 1.5rem; font-size: 0.85rem; text-align: left; }
        .input-group { margin-bottom: 1.5rem; text-align: left; position: relative; }
        label { display: block; margin-bottom: 0.5rem; font-weight: 600; font-size: 0.9rem; color: #444; }
        input[type="text"], input[type="password"] { width: 100%; padding: 0.75rem 1rem; border: 2px solid #ddd; border-radius: 6px; font-size: 1rem; outline: none; }
        input:focus { border-color: #007bff; }
        .toggle-password { position: absolute; right: 12px; top: 38px; background: none; border: none; color: #777; cursor: pointer; font-size: 0.85rem; }
        .utilities { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; font-size: 0.85rem; }
        .login-btn { width: 100%; padding: 0.75rem; background: #007bff; border: none; border-radius: 6px; color: white; font-size: 1rem; font-weight: 600; cursor: pointer; }
        .login-btn:hover { background: #0056b3; }

        /* PORTAL ACADEMY GRAPHICS */
        .dashboard-container { display: none; background: #ffffff; padding: 2.5rem; border-radius: 12px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15); width: 100%; max-width: 550px; text-align: center; }
        .grade-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 0.75rem; margin-bottom: 1.5rem; }
        .grade-title { font-size: 1.75rem; color: #007bff; font-weight: 700; }
        .logout-btn { background: #f8f9fa; border: 1px solid #ddd; padding: 0.4rem 0.8rem; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 600; color: #666; }
        .logout-btn:hover { background: #fce4e4; color: #cc0000; border-color: #fcc2c2; }
        
        .folder-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .folder-card { background: #f8f9fa; border: 2px solid #e9ecef; border-radius: 10px; padding: 1.5rem; text-align: center; cursor: pointer; font-weight: 700; color: #333; transition: all 0.2s ease; }
        .folder-card:hover { background: #e9ecef; border-color: #007bff; color: #007bff; transform: translateY(-2px); }
        .folder-icon { font-size: 2.2rem; margin-bottom: 0.5rem; display: block; }

        /* LIST VISUAL RENDERING */
        .topics-container { display: none; text-align: left; }
        .back-btn { display: inline-flex; align-items: center; gap: 5px; background: none; border: none; color: #007bff; font-weight: 700; cursor: pointer; font-size: 0.95rem; margin-bottom: 1.25rem; }
        .back-btn:hover { color: #0056b3; text-decoration: underline; }
        .term-heading { font-size: 1.4rem; color: #333; font-weight: 700; margin-bottom: 1rem; border-left: 4px solid #007bff; padding-left: 10px; }
        
        .topic-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
        .topic-item { display: flex; align-items: center; background: #f8f9fa; border: 1px solid #e9ecef; padding: 1rem; border-radius: 8px; font-weight: 800; font-size: 0.95rem; color: #222; text-transform: uppercase; }
        .topic-math-icon { margin-right: 12px; font-size: 1.2rem; color: #007bff; width: 24px; text-align: center; }
    </style>
</head>
<body>

    <!-- CONTAINER 1: AUTHENTICATION CONTAINER -->
    <div class="login-container" id="loginScreen">
        <div class="academy-logo">Michel Maths</div>
        <p class="subtitle">Academy Portal Login</p>
        <div class="error-alert" id="errorAlert"></div>
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="input-group">
                <label for="username">Username or Email</label>
                <input type="text" id="username" placeholder="Enter username..." required>
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
                <button type="button" class="toggle-password" onclick="togglePass()">Show</button>
            </div>
            <div class="utilities">
                <label><input type="checkbox"> Remember me</label>
                <a href="#" style="color: #007bff; text-decoration: none; font-weight: 600;">Forgot password?</a>
            </div>
            <button type="submit" class="login-btn">Log In</button>
        </form>
    </div>

    <!-- CONTAINER 2: RESOURCE ROOT VIEW -->
    <div class="dashboard-container" id="dashboardScreen">
        <div class="grade-header">
            <div class="grade-title">Grade 8</div>
            <button class="logout-btn" onclick="logout()">Log Out</button>
        </div>
        
        <!-- Grid Links -->
        <div id="termsView" class="folder-grid">
            <div class="folder-card" onclick="openTerm('term1')"><span class="folder-icon">📁</span>Term 1</div>
            <div class="folder-card" onclick="openTerm('term2')"><span class="folder-icon">📁</span>Term 2</div>
            <div class="folder-card" onclick="openTerm('term3')"><span class="folder-icon">📁</span>Term 3</div>
            <div class="folder-card" onclick="openTerm('term4')"><span class="folder-icon">📁</span>Term 4</div>
        </div>

        <!-- Hidden Curriculum Lists -->
        <div id="topicsView" class="topics-container">
            <button class="back-btn" onclick="showTerms()">&larr; BACK TO TERMS</button>
            <h3 class="term-heading" id="dynamicTermTitle">Term</h3>
            <ul class="topic-list" id="dynamicTopicList"></ul>
        </div>
    </div>

    <!-- ENGINE CONTROL DATA SHEET -->
    <script>
        const curriculum = {
            term1: {
                title: "TERM 1",
                topics: [
                    "WHOLE NUMBERS",
                    "INTEGERS",
                    "COMMON FRACTIONS",
                    "DECIMAL FRACTIONS",
                    "NUMERIC AND GEOMETRIC PATTERNS"
                ]
            },
            term2: {
                title: "TERM 2",
                topics: [
                    "EXPONENTS",
                    "ALGEBRAIC EXPRESSIONS",
                    "ALGEBRAIC EQUATIONS",
                    "FUNCTIONS AND RELATIONSHIPS",
                    "GRAPHS"
                ]
            },
            term3: {
                title: "TERM 3",
                topics: [
                    "DATA HANDLING",
                    "PROBABILITY",
                    "GEOMETRY OF STRAIGHT LINES",
                    "GEOMETRY OF 2D SHAPES"
                ]
            },
            term4: {
                title: "TERM 4",
                topics: [
                    "THEOREM OF PYTHAGORAS",
                    "TRANSFORMATION GEOMETRY",
                    "AREA AND PERIMETER OF 2-D SHAPES",
                    "SURFACE AREA AND VOLUME OF 3-D OBJECTS"
                ]
            }
        };

        function togglePass() {
            const passInput = document.getElementById('password');
            const toggleBtn = document.querySelector('.toggle-password');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                toggleBtn.textContent = 'Hide';
            } else {
                passInput.type = 'password';
                toggleBtn.textContent = 'Show';
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const usernameInput = document.getElementById('username').value.trim();
            const passwordInput = document.getElementById('password').value.trim();
            const errorAlert = document.getElementById('errorAlert');
            
            errorAlert.style.display = 'none';

            // Matches requested values exactly
            if (usernameInput === 'Michel' && passwordInput === 'Michel123') {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('dashboardScreen').style.display = 'block';
                showTerms();
            } else {
                errorAlert.textContent = 'Invalid username or password.';
                errorAlert.style.display = 'block';
            }
        }

        function openTerm(termKey) {
            const data = curriculum[termKey];
            document.getElementById('dynamicTermTitle').textContent = data.title;
            
            const listContainer = document.getElementById('dynamicTopicList');
            listContainer.innerHTML = ''; 
            
            data.topics.forEach((topic) => {
                const li = document.createElement('li');
                li.className = 'topic-item';
                li.innerHTML = `<span class="topic-math-icon">📐</span> <strong>${topic}</strong>`;
                listContainer.appendChild(li);
            });

            document.getElementById('termsView').style.display = 'none';
