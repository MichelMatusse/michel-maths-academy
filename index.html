<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Michel Maths Academy</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #007bff; display: flex; justify-content: center; align-items: center; height: 100vh; color: #333; overflow: hidden; }
        .login-container { background: #ffffff; padding: 2.5rem; border-radius: 12px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15); width: 100%; max-width: 400px; z-index: 10; text-align: center; }
        .academy-logo { font-size: 2rem; color: #0056b3; margin-bottom: 0.5rem; font-weight: 700; }
        .academy-logo span { color: #007bff; }
        .subtitle { color: #666; font-size: 0.95rem; margin-bottom: 1.5rem; }
        
        .input-group { margin-bottom: 1.5rem; text-align: left; position: relative; }
        label { display: block; margin-bottom: 0.5rem; font-weight: 600; font-size: 0.9rem; color: #444; }
        input[type="text"], input[type="password"] { width: 100%; padding: 0.75rem 1rem; border: 2px solid #ddd; border-radius: 6px; font-size: 1rem; outline: none; }
        input:focus { border-color: #007bff; }
        
        .utilities { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; font-size: 0.85rem; }
        .utilities a { color: #007bff; text-decoration: none; font-weight: 600; }
        .utilities a:hover { text-decoration: underline; }
        
        .login-btn { width: 100%; padding: 0.75rem; background: #007bff; border: none; border-radius: 6px; color: white; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.3s ease; }
        .login-btn:hover { background: #0056b3; }
        
        /* Modal Styles */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.4); z-index: 100; justify-content: center; align-items: center; }
        .modal-box { background: #fff; padding: 2rem; border-radius: 12px; width: 90%; max-width: 380px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .modal-box h3 { color: #0056b3; margin-bottom: 0.5rem; font-size: 1.3rem; }
        .modal-box p { color: #666; font-size: 0.95rem; margin-bottom: 1.5rem; }
        .modal-close { padding: 0.6rem 2rem; background: #007bff; border: none; border-radius: 6px; color: white; cursor: pointer; font-weight: 600; width: 100%; }
        .modal-close:hover { background: #0056b3; }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="academy-logo">Michel <span>Maths</span></div>
        <p class="subtitle">Academy Portal Login</p>
        
        <form id="loginForm">
            <div class="input-group">
                <label>Username / Email</label>
                <input type="text" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" required>
            </div>
            <div class="utilities">
                <label><input type="checkbox"> Remember me</label>
                <a href="#">Forgot password?</a>
            </div>
            <button type="submit" class="login-btn">Log In</button>
        </form>
    </div>

    <!-- Custom Modal Overlay replacing native Alert -->
    <div class="modal-overlay" id="successModal">
        <div class="modal-box">
            <h3>Success!</h3>
            <p>Logging you into Michel Maths Academy.</p>
            <button class="modal-close" id="modalBtn">OK</button>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const successModal = document.getElementById('successModal');
        const modalBtn = document.getElementById('modalBtn');

        loginForm.addEventListener('submit', function(e) {
            e.preventDefault(); // Stop page reload
            
            // Display the custom overlay modal flexbox style
            successModal.style.display = 'flex';
        });

        modalBtn.addEventListener('click', function() {
            successModal.style.display = 'none';
            
            // Redirect smoothly to your actual dashboard or next page here
            window.location.href = "dashboard.html"; 
        });
    </script>
</body>
</html>
